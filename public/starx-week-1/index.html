<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Little Filmmakers · Week 1 — Presenter Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141E36;
    --paper:#F7F5EF;
    --paper-2:#EDE9DF;
    --marigold:#E0A02A;
    --cherry:#C8323F;
    --teal:#2C8A85;
    --rule:rgba(20,30,54,.14);

    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Work Sans',system-ui,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono)}

  /* ===== DECK CHROME ===== */
  #deck{position:fixed;inset:0;background:var(--paper);overflow:hidden}

  .slide{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:min(3.2vh,44px) min(6.5vw,84px);
    background:var(--paper);
  }
  .slide.active{display:flex}
  .slide::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 90% -10%, rgba(224,160,42,.14), transparent 55%),
               radial-gradient(120% 90% at -10% 110%, rgba(44,138,133,.10), transparent 55%);
  }
  .slide-inner{position:relative;z-index:1;max-width:1180px;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px)}

  /* ---- asymmetric split layout (the editorial grid) ---- */
  .slide-inner.split{
    display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(26px,4vw,58px);
    align-items:center;text-align:left;max-width:1260px;width:100%;
  }
  .slide-inner.split.rev{grid-template-columns:1.08fr 1fr}
  .slide-inner.split.rev .text-col{order:2}
  .slide-inner.split.rev .media-col{order:1}
  .text-col{display:flex;flex-direction:column;gap:clamp(9px,1.6vh,16px);align-items:flex-start;min-width:0}
  .media-col{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:0;width:100%}

  .kind-head{display:flex;align-items:center;gap:12px}
  .kind-icon{
    width:clamp(46px,5.2vw,60px);height:clamp(46px,5.2vw,60px);border-radius:14px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .kind-icon svg{width:60%;height:60%;display:block}
  .kind-icon.c-live{background:rgba(200,50,63,.13);color:var(--cherry)}
  .kind-icon.c-anim{background:rgba(224,160,42,.16);color:var(--marigold)}
  .kind-icon.c-stop{background:rgba(44,138,133,.16);color:var(--teal)}
  .kind-icon.c-doc{background:rgba(20,30,54,.10);color:var(--ink)}

  .kind-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,18px);width:100%;max-width:440px}
  .kind-preview{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:clamp(16px,2.6vw,26px) 10px;border-radius:14px;background:#fff;border:1px solid var(--rule);
    box-shadow:0 8px 22px rgba(20,30,54,.08);
  }
  .kind-preview .kind-icon{width:clamp(52px,6.4vw,76px);height:clamp(52px,6.4vw,76px);border-radius:16px}
  .kind-preview .kp-label{font-family:var(--display);font-weight:700;font-size:clamp(12.5px,1.35vw,15px);color:var(--ink);text-align:center;letter-spacing:-.005em}

  .agenda-list{width:100%;border-top:2px solid var(--ink)}
  .agenda-row{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
  .agenda-row .a-n{font-family:var(--display);font-weight:800;font-size:clamp(18px,2.1vw,24px);color:rgba(20,30,54,.32)}
  .agenda-row .a-t{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.7vw,19px);letter-spacing:-.01em;color:var(--ink)}
  .agenda-row .a-d{font-family:var(--body);font-size:clamp(12.5px,1.35vw,14.5px);color:rgba(20,30,54,.62);margin-top:2px}

  .beat-graphic{width:clamp(120px,15vw,190px);color:var(--ink);opacity:.8;margin-top:6px}
  .beat-graphic svg{width:100%;display:block}
  .bg-mark{
    position:absolute;z-index:0;pointer-events:none;font-family:var(--display);font-weight:800;
    font-size:min(46vh,34vw);color:var(--ink);opacity:.045;line-height:1;letter-spacing:-.04em;
    bottom:-6%;right:-2%;
  }

  .eyebrow{
    font-family:var(--mono);font-size:clamp(12px,1.3vw,15px);letter-spacing:.16em;text-transform:uppercase;
    color:var(--cherry);
  }
  .headline{
    font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.08;
    font-size:clamp(1.85rem,4.7vw,3.7rem);
    color:var(--ink);
  }
  .split .headline{font-size:clamp(1.7rem,3.6vw,3.05rem)}
  .headline em{color:var(--cherry);font-style:normal}
  .headline .accent-teal{color:var(--teal);font-style:normal}
  .headline .accent-marigold{color:var(--marigold);font-style:normal}
  .subline{
    font-family:var(--body);font-weight:500;font-size:clamp(1.02rem,2vw,1.4rem);
    color:rgba(20,30,54,.72);max-width:52ch;line-height:1.48;
  }
  .split .subline{max-width:46ch}
  .callout{
    margin-top:2px;
    display:inline-block;font-family:var(--display);font-weight:700;
    font-size:clamp(.96rem,1.7vw,1.2rem);
    color:#fff;background:var(--cherry);padding:8px 18px;border-radius:3px;
  }
  .footnote{font-family:var(--mono);font-size:clamp(11px,1.1vw,13px);color:rgba(20,30,54,.5);letter-spacing:.02em}

  /* ===== TITLE SLIDE ===== */
  .title-slide .en-mark{font-family:var(--mono);font-size:clamp(12px,1.3vw,15px);letter-spacing:.2em;text-transform:uppercase;color:rgba(20,30,54,.5)}
  .title-slide h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7.4vw,5.8rem);letter-spacing:-.03em;line-height:1.0;color:var(--ink)}
  .title-slide .tagline{font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,2.3vw,1.6rem);color:var(--cherry)}
  .title-slide .weekbadge{
    margin-top:10px;font-family:var(--mono);font-size:clamp(12px,1.3vw,14px);
    color:rgba(20,30,54,.6);border:1px solid var(--rule);padding:8px 18px;border-radius:999px;
  }

  /* ===== CLIP STAGE ===== */
  .clip-row{display:flex;gap:clamp(16px,3vw,40px);align-items:stretch;justify-content:center;flex-wrap:wrap;width:100%}
  .clip-stage{width:min(460px,88vw,42vh)}
  .media-col .clip-stage{width:min(560px,100%,44vh)}
  .media-col .clip-stage.hero{width:min(640px,100%,44vh)}
  .support-img{display:flex;align-items:center;gap:11px;width:100%;max-width:460px;margin-top:1px}
  .support-img img{width:clamp(50px,5.8vw,68px);height:clamp(50px,5.8vw,68px);object-fit:cover;border-radius:8px;flex:none;box-shadow:0 4px 12px rgba(20,30,54,.2)}
  .support-img .si-text{text-align:left}
  .support-img .si-cap{font-family:var(--display);font-weight:700;font-size:clamp(11px,1.15vw,12.5px);color:var(--ink);line-height:1.3}
  .support-img .si-credit{font-family:var(--mono);font-size:9.5px;color:rgba(20,30,54,.5);margin-top:2px}
  .stage-frame{
    position:relative;background:var(--ink);border-radius:10px;overflow:hidden;
    aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 40px rgba(20,30,54,.28);
    background-size:cover;background-position:center;
  }
  .stage-frame.portrait{aspect-ratio:9/13}
  .stage-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .stage-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .stage-frame.ext-frame{background-image:linear-gradient(rgba(10,14,28,.18),rgba(10,14,28,.42)), var(--thumb)}
  .play-btn{
    position:relative;z-index:2;
    width:clamp(58px,8vw,84px);height:clamp(58px,8vw,84px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,2.8vw,28px);color:#fff;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    transition:transform .12s ease;
  }
  .play-btn:hover{transform:scale(1.06)}
  .play-btn.local{background:var(--cherry)}
  .play-btn.ext{background:var(--teal)}
  .play-btn .glyph{position:relative;left:2px}
  .stage-frame.playing .play-btn{opacity:0;pointer-events:none}
  .stage-frame .badge{
    position:absolute;top:10px;left:10px;z-index:2;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(247,245,239,.92);color:var(--ink);padding:4px 9px;border-radius:3px;
  }
  .stage-frame .badge.fallback{
    top:auto;left:auto;bottom:9px;right:9px;background:rgba(20,30,54,.55);color:#fff;
    text-decoration:none;font-size:10px;
  }
  .stage-frame.small{aspect-ratio:16/10}
  .stage-frame.small .play-btn{width:40px;height:40px;font-size:14px}
  .stage-frame.small .badge.fallback{display:none}
  .stage-caption{
    margin-top:6px;font-size:clamp(12px,1.25vw,14px);color:rgba(20,30,54,.8);line-height:1.4;
  }
  .stage-caption .mono{display:block;margin-top:3px;font-size:clamp(11px,1.05vw,12.5px);color:rgba(20,30,54,.55)}
  .stage-caption .src-tag{font-weight:600;color:var(--ink)}

  /* ===== GAME SLIDE ===== */
  .game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.3vw,14px);width:100%;max-width:900px}
  .game-slot{
    background:#fff;border:1.5px solid var(--rule);border-radius:8px;
    padding:clamp(7px,1.1vw,11px) 9px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:border-color .15s ease;
  }
  .game-slot.opened{border-color:var(--teal)}
  .game-slot .n{font-family:var(--display);font-weight:800;font-size:clamp(16px,1.8vw,21px);color:var(--ink);align-self:flex-start}
  .game-slot .stage-frame{width:100%;margin-top:-2px}
  .game-slot .stage-frame.small{aspect-ratio:16/7}
  .game-slot .reveal{
    font-family:var(--body);font-weight:600;font-size:clamp(10.5px,1.05vw,12.5px);color:var(--ink);
    min-height:1.3em;
  }
  .game-slot .reveal.hard{color:var(--marigold)}
  .game-slot button.slot-reveal{
    font-family:var(--mono);font-size:10px;color:rgba(20,30,54,.5);text-decoration:underline;
    letter-spacing:.02em;
  }

  /* ===== DUAL (optional) SLIDE ===== */
  .dual-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}

  /* ===== CHROME: counter / timer / hints ===== */
  #chrome{position:fixed;inset:0;pointer-events:none;z-index:20;font-family:var(--mono)}
  .chip{
    position:absolute;pointer-events:auto;
    font-size:12px;letter-spacing:.04em;color:rgba(20,30,54,.68);
    background:rgba(247,245,239,.86);backdrop-filter:blur(3px);
    padding:7px 12px;border-radius:999px;border:1px solid var(--rule);
    display:flex;align-items:center;gap:8px;
  }
  #counter{top:18px;left:18px}
  #segbar{top:18px;right:18px;flex-direction:row}
  #segbar .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
  #segbar.warn .dot{background:var(--marigold)}
  #segbar.over .dot{background:var(--cherry)}
  #segbar.warn{color:var(--marigold)}
  #segbar.over{color:var(--cherry)}
  #segbar button{font-family:var(--mono);color:inherit}
  #hints{bottom:16px;right:18px;font-size:10.5px;color:rgba(20,30,54,.45);background:transparent;border:none;padding:0}

  /* ===== NOTES PANEL ===== */
  #notes{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--ink);color:var(--paper);
    max-height:44vh;overflow:auto;
    transform:translateY(100%);transition:transform .22s ease;
    padding:22px clamp(20px,6vw,80px) 26px;
  }
  #notes.open{transform:translateY(0)}
  #notes .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold);margin-bottom:10px}
  #notes .txt{font-family:var(--body);font-size:clamp(14px,1.7vw,18px);line-height:1.8;white-space:pre-line;color:rgba(247,245,239,.94)}
  #notes .txt b{color:var(--marigold);font-weight:600}

  /* ===== GRID OVERVIEW ===== */
  #overview{
    position:fixed;inset:0;z-index:40;background:rgba(20,30,54,.96);
    display:none;align-items:center;justify-content:center;padding:5vh 4vw;
  }
  #overview.open{display:flex}
  .ov-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:1200px;width:100%}
  .ov-card{
    background:var(--paper);border-radius:8px;padding:14px 12px;text-align:left;
    border:2px solid transparent;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .ov-card:hover{border-color:var(--teal)}
  .ov-card.current{border-color:var(--cherry)}
  .ov-card .ov-n{font-family:var(--mono);font-size:11px;color:var(--cherry)}
  .ov-card .ov-t{font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.3;margin-top:4px}
  #overview .ov-close{
    position:absolute;top:22px;right:28px;color:var(--paper);font-family:var(--mono);font-size:13px;
    border:1px solid rgba(247,245,239,.3);padding:8px 16px;border-radius:999px;
  }

  @media (max-width:820px){
    .slide-inner.split,.slide-inner.split.rev{grid-template-columns:1fr;text-align:center}
    .slide-inner.split .text-col,.slide-inner.split .media-col{order:initial;align-items:center}
    .kind-head{flex-direction:column}
    .agenda-row{grid-template-columns:32px 1fr}
  }
  @media (max-width:760px){
    .ov-grid{grid-template-columns:repeat(3,1fr)}
    .game-grid{grid-template-columns:repeat(2,1fr)}
    #segbar{max-width:46vw}
  }
</style>
</head>
<body>

<div id="deck"><!-- slides injected by JS --></div>

<div id="chrome">
  <div class="chip" id="counter">01 / 16</div>
  <div class="chip" id="segbar"><span class="dot"></span><span id="segtext">—</span><button id="segreset" title="Click to restart the clock">↻</button></div>
  <div class="chip" id="hints">← → slides · Esc grid · N notes · Enter plays · 1–6 game slots</div>
</div>

<div id="notes">
  <div class="lbl">Presenter notes (N to hide)</div>
  <div class="txt" id="notes-txt"></div>
</div>

<div id="overview">
  <button class="ov-close" id="ov-close">Esc · close</button>
  <div class="ov-grid" id="ov-grid"></div>
</div>

<script>
(function(){

  // ---------- lesson-plan segment budget (minutes from class start) ----------
  var SEGMENTS = [
    {name:'Opening question',        end:5},
    {name:'Four kinds of film',      end:30},
    {name:'Guess the kind',          end:38},
    {name:'The first film ever made',end:52},
    {name:'The first visual effect', end:60}
  ];

  // ---------- icon marks for the four kinds (original geometric marks, not stills) ----------
  var ICONS = {
    live: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="50" cy="50" r="13" fill="currentColor"/><circle cx="78" cy="27" r="6" fill="currentColor"/></svg>',
    anim: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="30" y="18" width="46" height="60" rx="7" transform="rotate(11 53 48)" fill="currentColor" opacity=".28"/><rect x="24" y="16" width="46" height="60" rx="7" transform="rotate(-6 47 46)" fill="currentColor" opacity=".55"/><rect x="22" y="18" width="46" height="60" rx="7" fill="currentColor"/></svg>',
    stop: '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M10 80 Q 50 18 90 80" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="12" cy="78" r="5" fill="currentColor"/><circle cx="35" cy="45" r="7" fill="currentColor"/><circle cx="64" cy="35" r="9" fill="currentColor"/><circle cx="89" cy="72" r="11" fill="currentColor"/></svg>',
    doc:  '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="14" y="14" width="72" height="72" rx="10" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="50" cy="50" r="17" fill="currentColor"/><circle cx="50" cy="50" r="6.5" fill="var(--paper)"/></svg>',
    screens: '<svg viewBox="0 0 160 100" aria-hidden="true"><rect x="6" y="30" width="54" height="38" rx="5" fill="currentColor" opacity=".5"/><polygon points="26,42 26,56 40,49" fill="var(--paper)"/><rect x="66" y="14" width="46" height="66" rx="7" fill="currentColor"/><polygon points="82,40 82,54 96,47" fill="var(--paper)"/><rect x="118" y="34" width="38" height="30" rx="4" fill="currentColor" opacity=".75"/><polygon points="130,42 130,53 142,47.5" fill="var(--paper)"/></svg>',
    comedian: '<svg viewBox="0 0 100 120" aria-hidden="true"><ellipse cx="50" cy="34" rx="26" ry="7" fill="currentColor"/><path d="M30 34 Q30 12 50 12 Q70 12 70 34 Z" fill="currentColor"/><circle cx="50" cy="58" r="20" fill="currentColor"/><rect x="46" y="76" width="8" height="30" rx="3" fill="currentColor"/><path d="M78 70 Q92 70 92 84 Q92 96 80 96" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>'
  };

  // ---------- clip sources (see Film_Teaching/files/week-01-clips.md for full sourcing) ----------
  var CLIPS = {
    usine:     {type:'local', src:'media/lumiere-usine.mp4',    frame:'media/frames/usine.jpg',    title:'La Sortie de l’Usine Lumière · 1895', range:'0:00–0:38 · plays here'},
    train:     {type:'local', src:'media/lumiere-train.mp4',    frame:'media/frames/train.jpg',    title:'L’Arrivée d’un train en gare de La Ciotat · 1895–96', range:'0:00–0:45 · plays here'},
    arroseur:  {type:'local', src:'media/lumiere-arroseur.mp4', frame:'media/frames/arroseur.jpg', title:'L’Arroseur Arrosé · 1895', range:'0:00–0:40 · plays here'},
    lune:      {type:'local', src:'media/melies-lune-eye.mp4',  frame:'media/frames/lune-eye.jpg', title:'Le Voyage dans la Lune · 1902 · rocket-in-the-eye', range:'0:00–0:09 · plays here'},
    steamboat: {type:'local', src:'media/steamboat-willie.mp4', frame:'media/frames/steamboat.jpg', title:'Steamboat Willie · 1928 · Walt Disney / Ub Iwerks', range:'0:00–0:22 · plays here'},

    paddington:{type:'ext', id:'vFw_04XfV4I', title:'Paddington in Peru · “El Dorado” Clip · STUDIOCANAL', range:'0:00–1:25 · plays here'},
    shaun:     {type:'ext', id:'orLMm76lwjY', title:'Shaun the Sheep S7 · “Gone to the Dogs” · Aardman', range:'first 1:30 (no dialogue — any part works) · plays here'},
    bbcearth:  {type:'ext', id:'vdfMLAH1yJQ', title:'A Chameleon’s Race Against Time · BBC Earth', range:'first 2:30 · plays here'},
    lego:      {type:'ext', id:'BfhV3Q4LJPM', title:'LEGO · official ad', range:'0:00–1:00 · plays here'},
    elmo:      {type:'ext', id:'ksxbp9yb9BU', title:'Sesame Street · “Elmo’s Got the Moves!”', range:'whole short, vertical · plays here', portrait:true},

    g1:{type:'ext', id:'vFw_04XfV4I', start:0, answer:'Live action', hard:false},
    g2:{type:'ext', id:'EQROSyAMuOM', start:0, answer:'Animation', hard:false},
    g3:{type:'ext', id:'orLMm76lwjY', start:0, answer:'Stop-motion', hard:false},
    g4:{type:'ext', id:'vdfMLAH1yJQ', start:0, answer:'Documentary', hard:false},
    g5:{type:'ext', id:'7TavVZMewpY', start:8, answer:'Animation — but fully photoreal CG!', hard:true},
    g6:{type:'ext', id:'1Fg5iWmQjwk', start:0, answer:'Live action — shot to look like a tiny model!', hard:true}
  };

  function ytThumb(id){ return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg'; }
  function ytEmbedSrc(id, start){ return 'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1'+(start?('&start='+start):''); }

  function extIdleHTML(clipKey){
    var c = CLIPS[clipKey];
    return '<button class="play-btn ext" data-clip="'+clipKey+'"><span class="glyph">▶</span></button>' +
           '<a class="badge fallback" href="https://www.youtube.com/watch?v='+c.id+'" target="_blank" rel="noopener">open on youtube ↗</a>';
  }

  function stageHTML(clipKey, id, small){
    var c = CLIPS[clipKey];
    var sizeCls = small ? ' small' : '';
    if (c.type === 'local'){
      return '' +
        '<div class="clip-stage" data-clip="'+clipKey+'">' +
          '<div class="stage-frame" id="frame-'+id+'">' +
            '<video preload="metadata" playsinline poster="'+c.frame+'" id="video-'+id+'" src="'+c.src+'"></video>' +
            '<button class="play-btn local" data-clip="'+clipKey+'" data-video="video-'+id+'"><span class="glyph">▶</span></button>' +
          '</div>' +
          (small ? '' : '<div class="stage-caption"><span class="src-tag">'+c.title+'</span><span class="mono">'+c.range+'</span></div>') +
        '</div>';
    }
    var portraitCls = c.portrait ? ' portrait' : '';
    return '' +
      '<div class="clip-stage" data-clip="'+clipKey+'">' +
        '<div class="stage-frame ext-frame'+portraitCls+sizeCls+'" id="frame-'+id+'" style="--thumb:url(\''+ytThumb(c.id)+'\')">' +
          extIdleHTML(clipKey) +
        '</div>' +
        (small ? '' : '<div class="stage-caption"><span class="src-tag">'+c.title+'</span><span class="mono">'+c.range+'</span></div>') +
      '</div>';
  }

  function kindHead(eyebrow, iconKey, iconCls){
    return '<div class="kind-head"><div class="kind-icon '+iconCls+'">'+ICONS[iconKey]+'</div><div class="eyebrow">'+eyebrow+'</div></div>';
  }

  // ---------- 16 slides ----------
  var SLIDES = [
    { seg:-1, kind:'title',
      note:'One sentence for today: film isn’t just one thing — and somebody invented it, only about a hundred and thirty years ago.' },

    { seg:0, kind:'agenda', layout:'split',
      eyebrow:'TODAY’S PLAN',
      headline:'Four stops today.',
      agenda:[
        {t:'Four kinds of film', d:'Live action, animation, stop-motion, documentary — watch one of each.'},
        {t:'Guess the kind', d:'A fast game. Hands up, shout it out.'},
        {t:'The first film ever made', d:'1895. Fifty seconds. A room full of people who had never seen a moving photograph.'},
        {t:'The first special effect', d:'1902 — found completely by accident.'}
      ],
      note:'Here’s our map for the hour: what film actually is, a game to test it, then back to the very first film ever made — and the accident that invented special effects.' },

    { seg:0, kind:'plain',
      eyebrow:'OPENING QUESTION',
      headline:'What did you watch<br>yesterday?',
      sub:'Was that a film?',
      bgmark:'?',
      bgGraphic:'screens',
      note:'Ask: “What did you watch yesterday — was that a film?” Let them answer anything — a cartoon, a short video, an ad, something on a grandparent’s phone. Don’t rule anything out yet.\nThen: “Today we’re going to find out how many different shapes a film can take.”' },

    { seg:1, kind:'plain', layout:'split',
      eyebrow:'FOUR KINDS OF FILM',
      headline:'Film is not<br><em>one</em> thing.',
      kinds:[['live','Live action','c-live'],['anim','Animation','c-anim'],['stop','Stop-motion','c-stop'],['doc','Documentary','c-doc']],
      note:'Play each kind for two or three minutes. After each one, ask: “Was that filmed, or was it drawn?”' },

    { seg:1, kind:'clip', clip:'paddington', layout:'split', icon:'live', iconCls:'c-live',
      eyebrow:'① LIVE ACTION',
      headline:'Real people.<br>A camera right beside them.',
      note:'The point: real people were standing right there, with a camera beside them.\n(Placeholder clip — swap in whatever live-action the five kids are actually watching right now.)' },

    { seg:1, kind:'clip', clip:'steamboat', layout:'split-rev', icon:'anim', iconCls:'c-anim',
      eyebrow:'② ANIMATION',
      headline:'No real person.<br>Every frame is <em>drawn</em>.',
      sub:'12–24 drawings, every single second — this one is almost a hundred years old.',
      note:'The point: there’s no real person in this at all. Every single frame was drawn by hand — twelve to twenty-four drawings for one second.\nThis is Steamboat Willie (1928) — the first Mickey Mouse cartoon, and public domain, which is why we can show it directly instead of linking out.' },

    { seg:1, kind:'clip', clip:'shaun', layout:'split', icon:'stop', iconCls:'c-stop',
      eyebrow:'③ STOP-MOTION',
      headline:'Nobody drew it.<br>Nobody acted it.',
      sub:'Someone moved a toy — just a little — and took a photo. Then moved it again.',
      callout:'You will make one of these — Week 8.',
      note:'The point: nobody drew this, and nobody acted it. Someone moved a little figure — just a little — took a photo, moved it again, took another photo. A full day of work might only produce two seconds of film.\nSpend extra time here — they’ll be making one of these themselves. (Raw lesson-plan note: this says Week 7, the school-facing overview says Week 8 — confirm which before class.)' },

    { seg:1, kind:'clip', clip:'bbcearth', layout:'split-rev', icon:'doc', iconCls:'c-doc',
      eyebrow:'④ DOCUMENTARY',
      headline:'No actors. No script.',
      sub:'The camera waited three months — just for this.',
      supportImg:{src:'media/frames/chameleon-cc.jpg', alt:'Panther chameleon photograph', cap:'A real chameleon, photographed in the wild.', credit:'Charles J. Sharp · CC BY-SA 4.0'},
      note:'The point: no actors, no script. The camera crew may have waited three months in the wild just to catch this one moment.' },

    { seg:1, kind:'dual',
      eyebrow:'IF TIME HOLDS',
      headline:'Two more kinds',
      clips:['lego','elmo'],
      labels:['A 30-second ad','A vertical video'],
      note:'An ad tells a whole story in thirty seconds. A vertical video counts too — it’s just shot for a phone held upright.\nSkip this slide if you’re short on time.' },

    { seg:2, kind:'game',
      eyebrow:'GUESS THE KIND',
      headline:'Watch. Shout it out.',
      sub:'Live action? Animation? Stop-motion? Documentary?',
      note:'Play five or six short clips back to back, a few seconds each — hands up, shout the answer. Mix in two hard ones on purpose.\nThe point of this game isn’t to test them — it’s to make “sorting it out” feel like their own skill.' },

    { seg:3, kind:'plain',
      eyebrow:'THINK BACK',
      headline:'Now you know all the kinds.',
      sub:'So which one do you think came FIRST?',
      bgmark:'1st',
      note:'Now that they know all the kinds — ask: “So which one do you think came first?”' },

    { seg:3, kind:'clip', clip:'usine', layout:'split',
      eyebrow:'1895 · THE FIRST FILM EVER SHOWN',
      headline:'Workers Leaving<br>the Factory',
      sub:'Fifty seconds. That’s it. That’s the whole thing.',
      hero:true,
      supportImg:{src:'media/frames/lumiere-poster-1896.jpg', alt:'1896 poster for the Lumière Cinématographe', cap:'The actual poster for that first public screening, 1896.', credit:'Henri Brispot · public domain'},
      note:'A hundred and thirty years ago, people paid for a ticket, walked into a room, and watched exactly this — workers leaving a factory. They thought it was the most magical thing in the world, because before this, photographs didn’t move.' },

    { seg:3, kind:'clip', clip:'train', layout:'split-rev',
      eyebrow:'1895–96',
      headline:'The Arrival<br>of a Train',
      sub:'Some people say the audience screamed and ran.',
      hero:true,
      note:'Tell the legend: some people say the audience screamed and leapt out of their seats. Historians still argue about how true that actually is — which is itself a great way to get the kids thinking, so it’s fine to just say “some people say...”' },

    { seg:3, kind:'clip', clip:'arroseur', layout:'split',
      eyebrow:'THE WORLD’S FIRST FILM JOKE',
      headline:'The Sprinkler<br>Sprinkled',
      sub:'Why is it funny?',
      callout:'We can see the boy. The gardener can’t. That’s suspense.',
      hero:true,
      note:'The boy steps on the hose, the gardener bends down to look at the nozzle, the boy lifts his foot — the gardener gets a face full of water.\nPush on “why is it funny?” until they land on: “because we can see the boy doing it, and the gardener can’t.” That’s suspense — and a first-grader can absolutely feel it.' },

    { seg:4, kind:'clip', clip:'lune', layout:'split-rev',
      eyebrow:'1902 · THE FIRST VISUAL EFFECT',
      headline:'A Trip to<br>the Moon',
      sub:'Found completely by accident.',
      callout:'The camera jammed. When he fixed it and kept rolling — the carriage on his film had become a hearse.',
      hero:true,
      supportImg:{src:'media/frames/melies-portrait.jpg', alt:'Portrait of Georges Méliès', cap:'Georges Méliès — magician first, filmmaker second.', credit:'ca. 1890 · public domain'},
      note:'Méliès was originally a stage magician. One day he was filming a carriage on a Paris street when his camera jammed; he fixed it and kept rolling. That night, watching the footage back — the carriage had turned into a hearse.\nHe immediately understood: stop the camera for a moment, and anything can vanish or appear. That’s the world’s first special effect — and it was found completely by accident.' },

    { seg:4, kind:'plain',
      eyebrow:'NEXT WEEK',
      headline:'The funniest man<br>of a hundred years ago.',
      sub:'He never says a single word. The whole world laughs anyway.',
      bgmark:'→',
      bgGraphic:'comedian',
      note:'Tease it: “Next week we meet the funniest man of a hundred years ago. He never says a single word — and the whole world still laughs.”' }
  ];

  // ---------- render ----------
  var deck = document.getElementById('deck');
  var html = '';
  SLIDES.forEach(function(s, i){
    var cls = 'slide' + (s.kind==='title' ? ' title-slide' : '');
    html += '<section class="'+cls+'" data-i="'+i+'">';
    if (s.bgmark) html += '<div class="bg-mark">'+s.bgmark+'</div>';

    if (s.kind === 'title'){
      html += '<div class="slide-inner">';
      html += '<div class="en-mark">STARX FILM CLUB · SESSION 1</div>';
      html += '<h1>Little Filmmakers</h1>';
      html += '<div class="tagline">What is a film — and who invented it?</div>';
      html += '<div class="weekbadge">WEEK 1 · THE DIFFERENT FORMS A FILM CAN TAKE</div>';
      html += '</div>';

    } else if (s.kind === 'agenda'){
      html += '<div class="slide-inner split">';
      html += '<div class="text-col">';
      html += '<div class="eyebrow">'+s.eyebrow+'</div>';
      html += '<h1 class="headline">'+s.headline+'</h1>';
      html += '</div>';
      html += '<div class="media-col"><div class="agenda-list">';
      s.agenda.forEach(function(a, idx){
        html += '<div class="agenda-row"><div class="a-n">'+String(idx+1).padStart(2,'0')+'</div><div><div class="a-t">'+a.t+'</div><div class="a-d">'+a.d+'</div></div></div>';
      });
      html += '</div></div>';
      html += '</div>';

    } else if (s.kind === 'clip' && s.layout){
      var revCls = s.layout === 'split-rev' ? ' rev' : '';
      html += '<div class="slide-inner split'+revCls+'">';
      html += '<div class="text-col">';
      if (s.icon) html += kindHead(s.eyebrow, s.icon, s.iconCls);
      else html += '<div class="eyebrow">'+s.eyebrow+'</div>';
      html += '<h1 class="headline">'+s.headline+'</h1>';
      if (s.sub) html += '<div class="subline">'+s.sub+'</div>';
      if (s.callout) html += '<div class="callout">'+s.callout+'</div>';
      html += '</div>';
      html += '<div class="media-col">';
      var stage = stageHTML(s.clip, i, false);
      if (s.hero) stage = stage.replace('class="clip-stage"', 'class="clip-stage hero"');
      html += stage;
      if (s.supportImg){
        html += '<div class="support-img"><img src="'+s.supportImg.src+'" alt="'+s.supportImg.alt+'"><div class="si-text"><div class="si-cap">'+s.supportImg.cap+'</div><div class="si-credit">'+s.supportImg.credit+'</div></div></div>';
      }
      html += '</div>';
      html += '</div>';

    } else if (s.kind === 'plain' && s.layout === 'split'){
      html += '<div class="slide-inner split">';
      html += '<div class="text-col">';
      html += '<div class="eyebrow">'+s.eyebrow+'</div>';
      html += '<h1 class="headline">'+s.headline+'</h1>';
      html += '</div>';
      html += '<div class="media-col"><div class="kind-preview-grid">';
      s.kinds.forEach(function(kd){
        html += '<div class="kind-preview"><div class="kind-icon '+kd[2]+'">'+ICONS[kd[0]]+'</div><div class="kp-label">'+kd[1]+'</div></div>';
      });
      html += '</div></div>';
      html += '</div>';

    } else {
      html += '<div class="slide-inner">';
      if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
      if (s.headline) html += '<h1 class="headline">'+s.headline+'</h1>';
      if (s.sub) html += '<div class="subline">'+s.sub+'</div>';
      if (s.callout) html += '<div class="callout">'+s.callout+'</div>';
      if (s.bgGraphic) html += '<div class="beat-graphic">'+ICONS[s.bgGraphic]+'</div>';

      if (s.kind === 'dual'){
        html += '<div class="clip-row">';
        s.clips.forEach(function(ck, j){
          html += '<div><div class="dual-label">'+s.labels[j]+'</div>'+stageHTML(ck, i+'-'+j, false)+'</div>';
        });
        html += '</div>';
      }
      if (s.kind === 'game'){
        html += '<div class="game-grid">';
        ['g1','g2','g3','g4','g5','g6'].forEach(function(gk, idx){
          var n = idx+1;
          html += '' +
            '<div class="game-slot" id="slot-'+gk+'" data-clip="'+gk+'">' +
              '<div class="n">'+n+'</div>' +
              stageHTML(gk, gk, true) +
              '<button class="slot-reveal" data-clip="'+gk+'">reveal answer</button>' +
              '<div class="reveal" id="reveal-'+gk+'"></div>' +
            '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    }

    html += '</section>';
  });
  deck.innerHTML = html;

  // ---------- overview grid content ----------
  var total = SLIDES.length;
  var ovGrid = document.getElementById('ov-grid');
  var ovHtml = '';
  SLIDES.forEach(function(s, i){
    var label = s.kind==='title' ? 'Title' : (s.headline ? s.headline.replace(/<[^>]+>/g,' ') : (s.eyebrow||'Slide'));
    ovHtml += '<button class="ov-card" data-jump="'+i+'"><span class="ov-n">'+String(i+1).padStart(2,'0')+' / '+total+'</span><span class="ov-t">'+label+'</span></button>';
  });
  ovGrid.innerHTML = ovHtml;

  // ---------- navigation state ----------
  var current = 0;
  var slideEls = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var notesEl = document.getElementById('notes');
  var notesTxt = document.getElementById('notes-txt');
  var notesOpen = false;
  var overviewEl = document.getElementById('overview');
  var overviewOpen = false;

  function renderNotes(){
    var n = SLIDES[current].note || '(no presenter note for this slide)';
    notesTxt.textContent = n;
  }

  function resetLocalFrame(vid){
    var frame = vid.closest('.stage-frame');
    frame.classList.remove('playing');
    var glyph = frame.querySelector('.play-btn .glyph');
    if (glyph) glyph.textContent = '▶';
  }

  function pauseAllVideo(){
    document.querySelectorAll('video').forEach(function(v){
      v.pause();
      resetLocalFrame(v);
    });
  }

  function stopAllExtFrames(root){
    (root||document).querySelectorAll('.stage-frame.ext-frame.playing').forEach(function(f){
      var wrap = f.closest('[data-clip]');
      var key = wrap ? wrap.getAttribute('data-clip') : null;
      if (!key || !CLIPS[key]) return;
      f.classList.remove('playing');
      f.innerHTML = extIdleHTML(key);
    });
  }

  function goTo(i){
    if (i < 0) i = 0;
    if (i > total-1) i = total-1;
    pauseAllVideo();
    stopAllExtFrames(slideEls[current]);
    slideEls[current].classList.remove('active');
    current = i;
    slideEls[current].classList.add('active');
    document.getElementById('counter').textContent = String(current+1).padStart(2,'0') + ' / ' + total;
    renderNotes();
    updateOverviewHighlight();
  }

  function updateOverviewHighlight(){
    document.querySelectorAll('.ov-card').forEach(function(c){
      c.classList.toggle('current', parseInt(c.getAttribute('data-jump'),10) === current);
    });
  }

  function toggleNotes(force){
    notesOpen = (typeof force === 'boolean') ? force : !notesOpen;
    notesEl.classList.toggle('open', notesOpen);
  }

  function toggleOverview(force){
    overviewOpen = (typeof force === 'boolean') ? force : !overviewOpen;
    overviewEl.classList.toggle('open', overviewOpen);
    if (overviewOpen) updateOverviewHighlight();
    else stopAllExtFrames(overviewEl);
  }

  function playExt(clipKey, frame){
    var c = CLIPS[clipKey];
    frame.classList.add('playing');
    frame.innerHTML = '<iframe src="'+ytEmbedSrc(c.id, c.start)+'" title="'+c.title+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  }

  // ---------- clip play wiring (event delegation) ----------
  deck.addEventListener('click', function(e){
    var playBtn = e.target.closest('.play-btn');
    if (playBtn){
      var clipKey = playBtn.getAttribute('data-clip');
      var c = CLIPS[clipKey];
      var frame = playBtn.closest('.stage-frame');
      if (c.type === 'local'){
        var vid = document.getElementById(playBtn.getAttribute('data-video'));
        frame.classList.add('playing');
        vid.currentTime = 0;
        vid.play().catch(function(){});
        vid.onended = function(){ frame.classList.remove('playing'); frame.querySelector('.play-btn') && (frame.querySelector('.play-btn').querySelector('.glyph').textContent = '↻'); };
      } else {
        playExt(clipKey, frame);
      }
      return;
    }
    var slotReveal = e.target.closest('.slot-reveal');
    if (slotReveal){
      var rk = slotReveal.getAttribute('data-clip');
      var c2 = CLIPS[rk];
      var target = document.getElementById('reveal-'+rk);
      target.textContent = '→ ' + c2.answer;
      target.classList.toggle('hard', !!c2.hard);
      return;
    }
    var fallback = e.target.closest('.badge.fallback');
    if (fallback) return; // let the link open normally, don't treat as a play action
  });

  // ---------- overview interactions ----------
  ovGrid.addEventListener('click', function(e){
    var card = e.target.closest('.ov-card');
    if (!card) return;
    toggleOverview(false);
    goTo(parseInt(card.getAttribute('data-jump'),10));
  });
  document.getElementById('ov-close').addEventListener('click', function(){ toggleOverview(false); });

  // ---------- segment timer ----------
  var startTime = Date.now();
  var segbar = document.getElementById('segbar');
  var segtext = document.getElementById('segtext');
  document.getElementById('segreset').addEventListener('click', function(e){
    e.stopPropagation();
    startTime = Date.now();
  });

  function pad2(n){ return (n<10?'0':'')+n; }

  function tickTimer(){
    var elapsedSec = Math.floor((Date.now() - startTime)/1000);
    var mm = Math.floor(elapsedSec/60), ss = elapsedSec%60;
    var elapsedMin = elapsedSec/60;

    var seg = SEGMENTS[SEGMENTS.length-1];
    for (var k=0;k<SEGMENTS.length;k++){ if (elapsedMin < SEGMENTS[k].end){ seg = SEGMENTS[k]; break; } }

    var state = 'ok';
    if (elapsedMin >= seg.end) state = 'over';
    else if (elapsedMin >= seg.end - (seg.end>=30 && SEGMENTS.indexOf(seg)>0 ? 5 : 1)) state = 'warn';

    segbar.classList.toggle('warn', state==='warn');
    segbar.classList.toggle('over', state==='over');
    segtext.textContent = seg.name + ' · ' + pad2(mm) + ':' + pad2(ss) + ' / ' + seg.end + ':00';
  }
  setInterval(tickTimer, 1000);
  tickTimer();

  // ---------- keyboard ----------
  document.addEventListener('keydown', function(e){
    if (overviewOpen){
      if (e.key === 'Escape') { toggleOverview(false); e.preventDefault(); }
      return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ goTo(current+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ goTo(current-1); e.preventDefault(); }
    else if (e.key === 'Escape'){ toggleOverview(true); e.preventDefault(); }
    else if (e.key === 'n' || e.key === 'N'){ toggleNotes(); e.preventDefault(); }
    else if (e.key === 'Enter'){
      var activeSlide = slideEls[current];
      var btn = activeSlide.querySelector('.play-btn');
      if (btn) btn.click();
      e.preventDefault();
    }
    else if (/^[1-6]$/.test(e.key)){
      var gk = 'g' + e.key;
      var f = document.getElementById('frame-'+gk);
      if (f){
        var b = f.querySelector('.play-btn');
        if (b) b.click();
        document.getElementById('slot-'+gk).classList.add('opened');
      }
    }
  });

  // ---------- init ----------
  goTo(0);
})();
</script>
</body>
</html>
