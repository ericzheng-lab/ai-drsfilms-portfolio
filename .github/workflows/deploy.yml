name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Checks also run on PRs so a broken page goes red BEFORE it can be merged.
  # The deploy job below is guarded to push-on-main, so a PR never deploys.
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the checker uses only the Node standard library.
      - name: Syntax-check inline <script> blocks
        run: npm run check:html

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ai-drsfilms
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
